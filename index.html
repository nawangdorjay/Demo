<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Advanced 3D World</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #000;
        }
        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
        }
        
        #ui-overlay {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 100;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 300px;
        }
        
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .instructions {
            font-size: 0.9rem;
            line-height: 1.6;
            opacity: 0.9;
        }
        
        .instructions p {
            margin: 5px 0;
        }
        
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }
        
        .loader {
            text-align: center;
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            color: white;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loader">
            <div class="spinner"></div>
            <div class="loading-text">Loading 3D World...</div>
        </div>
    </div>
    
    <div id="canvas-container"></div>
    
    <div id="ui-overlay">
        <h1>🌍 3D World Explorer</h1>
        <div class="instructions">
            <p>👆 <strong>Drag</strong> to rotate</p>
            <p>🤏 <strong>Pinch</strong> to zoom</p>
            <p>🔄 <strong>Scroll</strong> to zoom in/out</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.FogExp2(0x87CEEB, 0.002);

        // Camera
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            10000
        );
        camera.position.set(0, 500, 800);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ 
            antialias: true,
            powerPreference: "high-performance"
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Create detailed terrain
        function createTerrain() {
            const geometry = new THREE.PlaneGeometry(2000, 2000, 512, 512);
            
            // Generate detailed heightmap
            const vertices = geometry.attributes.position.array;
            const colors = [];
            
            for (let i = 0; i < vertices.length; i += 3) {
                const x = vertices[i];
                const y = vertices[i + 1];
                
                // Multi-octave noise for realistic terrain
                let height = 0;
                height += Math.sin(x * 0.01) * Math.cos(y * 0.01) * 100;
                height += Math.sin(x * 0.03 + 1) * Math.cos(y * 0.02) * 50;
                height += Math.sin(x * 0.05) * Math.sin(y * 0.05) * 25;
                height += Math.sin(x * 0.1 + 2) * Math.cos(y * 0.08) * 12;
                height += Math.random() * 5;
                
                vertices[i + 2] = height;
                
                // Color based on height
                const normalizedHeight = (height + 100) / 200;
                let r, g, b;
                
                if (normalizedHeight < 0.3) {
                    // Deep water
                    r = 0.1; g = 0.3; b = 0.6;
                } else if (normalizedHeight < 0.4) {
                    // Shallow water/beach
                    r = 0.76; g = 0.7; b = 0.5;
                } else if (normalizedHeight < 0.6) {
                    // Grass/plains
                    r = 0.2; g = 0.6; b = 0.2;
                } else if (normalizedHeight < 0.75) {
                    // Forest
                    r = 0.1; g = 0.4; b = 0.1;
                } else if (normalizedHeight < 0.85) {
                    // Mountain
                    r = 0.5; g = 0.45; b = 0.4;
                } else {
                    // Snow peak
                    r = 0.95; g = 0.95; b = 0.95;
                }
                
                colors.push(r, g, b);
            }
            
            geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
            geometry.computeVertexNormals();
            
            const material = new THREE.MeshStandardMaterial({
                vertexColors: true,
                roughness: 0.8,
                metalness: 0.1,
                flatShading: false
            });
            
            const terrain = new THREE.Mesh(geometry, material);
            terrain.rotation.x = -Math.PI / 2;
            terrain.receiveShadow = true;
            terrain.castShadow = true;
            
            return terrain;
        }

        // Add water plane
        function createWater() {
            const geometry = new THREE.PlaneGeometry(2000, 2000);
            const material = new THREE.MeshStandardMaterial({
                color: 0x0066ff,
                transparent: true,
                opacity: 0.6,
                roughness: 0.2,
                metalness: 0.8
            });
            
            const water = new THREE.Mesh(geometry, material);
            water.rotation.x = -Math.PI / 2;
            water.position.y = -10;
            
            return water;
        }

        // Add trees
        function createTrees() {
            const trees = new THREE.Group();
            const trunkGeometry = new THREE.CylinderGeometry(5, 8, 40, 8);
            const trunkMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x4a3728,
                roughness: 0.9
            });
            
            const leavesGeometry = new THREE.ConeGeometry(30, 80, 8);
            const leavesMaterial = new THREE.MeshStandardMaterial({ 
                color: 0x228B22,
                roughness: 0.8
            });
            
            for (let i = 0; i < 200; i++) {
                const tree = new THREE.Group();
                
                const trunk = new THREE.Mesh(trunkGeometry, trunkMaterial);
                trunk.position.y = 20;
                trunk.castShadow = true;
                
                const leaves = new THREE.Mesh(leavesGeometry, leavesMaterial);
                leaves.position.y = 70;
                leaves.castShadow = true;
                
                tree.add(trunk);
                tree.add(leaves);
                
                // Position trees on higher ground
                const angle = Math.random() * Math.PI * 2;
                const radius = 200 + Math.random() * 600;
                tree.position.x = Math.cos(angle) * radius;
                tree.position.z = Math.sin(angle) * radius;
                tree.position.y = 20 + Math.random() * 30;
                
                const scale = 0.8 + Math.random() * 0.4;
                tree.scale.set(scale, scale, scale);
                
                trees.add(tree);
            }
            
            return trees;
        }

        // Add clouds
        function createClouds() {
            const clouds = new THREE.Group();
            const cloudGeometry = new THREE.SphereGeometry(40, 8, 8);
            const cloudMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                transparent: true,
                opacity: 0.8,
                roughness: 0.5
            });
            
            for (let i = 0; i < 50; i++) {
                const cloud = new THREE.Group();
                const numSpheres = 3 + Math.floor(Math.random() * 5);
                
                for (let j = 0; j < numSpheres; j++) {
                    const sphere = new THREE.Mesh(cloudGeometry, cloudMaterial);
                    sphere.position.set(
                        (Math.random() - 0.5) * 100,
                        (Math.random() - 0.5) * 30,
                        (Math.random() - 0.5) * 100
                    );
                    const scale = 0.5 + Math.random() * 1;
                    sphere.scale.set(scale, scale * 0.6, scale);
                    cloud.add(sphere);
                }
                
                cloud.position.set(
                    (Math.random() - 0.5) * 1500,
                    400 + Math.random() * 200,
                    (Math.random() - 0.5) * 1500
                );
                
                clouds.add(cloud);
            }
            
            return clouds;
        }

        // Lighting
        const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.2);
        sunLight.position.set(500, 800, 500);
        sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 4096;
        sunLight.shadow.mapSize.height = 4096;
        sunLight.shadow.camera.near = 100;
        sunLight.shadow.camera.far = 2000;
        sunLight.shadow.camera.left = -1000;
        sunLight.shadow.camera.right = 1000;
        sunLight.shadow.camera.top = 1000;
        sunLight.shadow.camera.bottom = -1000;
        scene.add(sunLight);

        // Hemisphere light for sky/ground color variation
        const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x3d5c3d, 0.6);
        scene.add(hemiLight);

        // Build the scene
        const terrain = createTerrain();
        scene.add(terrain);

        const water = createWater();
        scene.add(water);

        const trees = createTrees();
        scene.add(trees);

        const clouds = createClouds();
        scene.add(clouds);

        // Orbit controls implementation
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let spherical = {
            radius: 900,
            theta: Math.PI / 4,
            phi: Math.PI / 3
        };
        
        let targetZoom = spherical.radius;
        let currentZoom = spherical.radius;

        // Mouse/Touch events
        const canvas = renderer.domElement;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const deltaX = e.clientX - previousMousePosition.x;
            const deltaY = e.clientY - previousMousePosition.y;

            spherical.theta -= deltaX * 0.005;
            spherical.phi = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, spherical.phi - deltaY * 0.005));

            previousMousePosition = { x: e.clientX, y: e.clientY };
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
        });

        // Touch events
        canvas.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                isDragging = true;
                previousMousePosition = { 
                    x: e.touches[0].clientX, 
                    y: e.touches[0].clientY 
                };
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            
            if (e.touches.length === 1 && isDragging) {
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;

                spherical.theta -= deltaX * 0.005;
                spherical.phi = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, spherical.phi - deltaY * 0.005));

                previousMousePosition = { 
                    x: e.touches[0].clientX, 
                    y: e.touches[0].clientY 
                };
            } else if (e.touches.length === 2) {
                // Pinch to zoom
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                
                if (!window.previousPinchDist) {
                    window.previousPinchDist = dist;
                }
                
                const delta = dist - window.previousPinchDist;
                targetZoom = Math.max(200, Math.min(2000, targetZoom - delta * 2));
                window.previousPinchDist = dist;
            }
        }, { passive: false });

        canvas.addEventListener('touchend', (e) => {
            if (e.touches.length === 0) {
                isDragging = false;
                window.previousPinchDist = null;
            }
        });

        // Mouse wheel zoom
        canvas.addEventListener('wheel', (e) => {
            e.preventDefault();
            targetZoom = Math.max(200, Math.min(2000, targetZoom + e.deltaY * 0.5));
        }, { passive: false });

        // Update camera position
        function updateCamera() {
            // Smooth zoom
            currentZoom += (targetZoom - currentZoom) * 0.1;
            spherical.radius = currentZoom;

            camera.position.x = spherical.radius * Math.sin(spherical.phi) * Math.cos(spherical.theta);
            camera.position.y = spherical.radius * Math.cos(spherical.phi);
            camera.position.z = spherical.radius * Math.sin(spherical.phi) * Math.sin(spherical.theta);
            
            camera.lookAt(0, 100, 0);
        }

        // Animation loop
        function animate() {
            requestAnimationFrame(animate);
            
            updateCamera();
            
            // Animate water
            water.material.opacity = 0.5 + Math.sin(Date.now() * 0.001) * 0.1;
            
            // Slowly rotate clouds
            clouds.rotation.y += 0.0001;
            
            renderer.render(scene, camera);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Hide loading screen
        setTimeout(() => {
            const loading = document.getElementById('loading');
            loading.style.opacity = '0';
            setTimeout(() => {
                loading.style.display = 'none';
            }, 500);
        }, 1000);

        // Start animation
        animate();
    </script>
</body>
</html>
